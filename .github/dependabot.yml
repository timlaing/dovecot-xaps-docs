version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    assignees: [timlaing]
    groups:
      python:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    assignees: [timlaing]
    groups:
      documentation-tools:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    assignees: [timlaing]
    groups:
      actions:
        patterns: ["*"]
