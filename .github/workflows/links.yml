name: External links
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: external-links
  cancel-in-progress: true
jobs:
  links:
    name: Check external links
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --no-progress --max-concurrency 4 --max-retries 3 --retry-wait-time 5 --timeout 30 --include-verbatim "docs/**/*.md" "*.md"
          fail: true

  validation-result:
    name: Validate links
    needs:
      - links
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every validation job to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 -I - <<'PY'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          failed = [name for name, job in results.items() if job['result'] != 'success']
          if failed:
              raise SystemExit('Validation incomplete: ' + ', '.join(failed))
          PY
